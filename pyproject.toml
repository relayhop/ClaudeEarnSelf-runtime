[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tz-radar"
version = "0.1.0"
description = "Timezone-aware first-mover radar for low-competition opportunities"
requires-python = ">=3.10"

[project.scripts]
tz-radar = "tz_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
