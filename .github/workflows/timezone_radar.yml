name: Timezone Radar

on:
  schedule:
    - cron: '29 8 * * *'  # Run at 08:29 UTC daily

jobs:
  timezone-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run timezone radar script
        run: |
          python scripts/timezone_radar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}