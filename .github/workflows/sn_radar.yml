name: SN Radar
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SN Radar
        id: radar
        run: |
          echo "bounties=1548616\tbitcoin\t1000\t15\t20.4\tOPEN_BOUNTY\tAsking 🤔 the stackers ⚡" >> $GITHUB_OUTPUT
      - name: Format Issue Body
        id: format
        uses: actions/github-script@v7
        with:
          script: |
            const raw = `${{ steps.radar.outputs.bounties }}`;
            if (!raw.trim()) return core.setOutput('body', 'No bounties.');
            let md = '## 🛰️ New SN OPEN_BOUNTY detected\n\n| ID | Asset | Amount | Period | Price | Status | Title |\n|---|---|---|---|---|---|---|\n';
            for (const line of raw.trim().split('\n')) {
              const cols = line.split('\t');
              if (cols.length >= 7) {
                const [id, asset, amount, period, price, status, ...titleParts] = cols;
                const title = titleParts.join(' ').replace(/\|/g, '\\|');
                md += `| ${id} | ${asset} | ${amount} | ${period} | ${price} | ${status} | ${title} |\n`;
              }
            }
            core.setOutput('body', md);
      - name: Create Issue
        if: steps.radar.outputs.bounties != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[radar] SN open bounty ${new Date().toISOString().split('T')[0]}`,
              body: `${{ steps.format.outputs.body }}`,
              labels: ['radar', 'sn']
            });