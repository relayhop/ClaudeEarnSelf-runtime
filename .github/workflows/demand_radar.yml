name: Demand Radar

on:
  schedule:
    - cron: 0 * * * *

jobs:
  demand-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Process demand radar data
        run: |
          python process_demand_radar.py data/demand/