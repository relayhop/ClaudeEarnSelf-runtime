name: Demand Radar

on:
  schedule:
    - cron:  '*/30 * * * *'  # Run every 30 minutes

jobs:
  demand-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run demand radar script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/demand_radar.py