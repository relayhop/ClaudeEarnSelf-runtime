name: Demand Radar

on:
  schedule:
    - cron: 0 * * * *

jobs:
  demand-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Process demand data
        run: |
          python - <<EOF
import pandas as pd
import glob

# Load demand data from TSV files
demand_data = pd.concat((pd.read_csv(file, sep='\t') for file in glob.glob('data/demand/*.tsv')), ignore_index=True)

# Filter high-priority issues
high_priority_issues = demand_data[(demand_data['priority'] == 5) & (demand_data['bounty_amount'] > 0)]

# Save the filtered data to a new file
high_priority_issues.to_csv('data/demand/high_priority_issues.tsv', sep='\t', index=False)
EOF

      - name: Upload high-priority issues
        uses: actions/upload-artifact@v2
        with:
          name: high-priority-issues
          path: data/demand/high_priority_issues.tsv